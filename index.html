<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>寵物日記</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#2b2724;--sub:#8a827a;--line:#ece7e1;--ac:#e8896b;--acbg:#fcebe5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--card:#262321;--tx:#f1ece6;--sub:#9a928a;--line:#37332f;--ac:#f0997c;--acbg:#3a2a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a18;--card:#262321;--tx:#f1ece6;--sub:#9a928a;--line:#37332f;--ac:#f0997c;--acbg:#3a2a25;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.app{max-width:480px;margin:0 auto;padding:16px 16px 150px}
.pets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:14px;border:1px solid var(--line)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mh b{font-size:17px}
.nb{border:0;background:none;color:var(--tx);font-size:22px;padding:4px 12px}
.g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:4px}
.w{font-size:12px;color:var(--sub);padding:4px 0}
.d{position:relative;height:42px;border:0;background:none;color:var(--tx);font-size:15px;border-radius:12px}
.d.t{color:var(--ac);font-weight:700}
.d.s{background:var(--ac);color:#fff}
.d.h::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.d.s.h::after{background:#fff}
h3{margin:0 0 8px;font-size:15px;color:var(--sub);font-weight:600}
.r{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.r:first-of-type{border-top:0}
.r .e{font-size:22px}
.r .m{flex:1;min-width:0}
.r .m b{font-size:15px}
.r .m div{font-size:14px;color:var(--sub);white-space:pre-wrap;word-break:break-word;margin-top:2px}
.x{border:0;background:none;color:var(--sub);font-size:20px;padding:6px 8px}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ac);color:#fff;border:0;border-radius:28px;padding:15px 28px;font-size:17px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.gear{float:right;border:0;background:none;font-size:20px;color:var(--sub)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:88%;overflow-y:auto}
.sh h2{margin:0 0 12px;font-size:18px}
.ty{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ty button{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:14px;padding:10px 2px;font-size:12px}
.ty button span{display:block;font-size:24px}
.ty button.on{border-color:var(--ac);background:var(--acbg)}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px;font-size:16px;font-family:inherit;margin-bottom:10px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;background:var(--ac);color:#fff}
.btn.g2{background:var(--acbg);color:var(--ac);margin-top:8px}
.row{display:flex;gap:8px}
.pr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--acbg:color-mix(in srgb,var(--ac) 14%,var(--card)) !important}
.sw{width:36px;height:36px;border-radius:50%;padding:0}
.nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav button{flex:1;border:0;background:none;color:var(--sub);padding:8px 0 6px;font-size:11px;font-family:inherit}
.nav button span{display:block;font-size:21px}
.nav button.on{color:var(--ac);font-weight:700}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:4px}
.big{width:110px;height:110px;border-radius:50%;background:var(--acbg);display:flex;align-items:center;justify-content:center;font-size:54px;margin:0 auto 8px;overflow:hidden}
.big img{width:100%;height:100%;object-fit:cover}
.lb{display:block;font-size:13px;color:var(--sub);margin:2px 0 4px}
.mrow{display:flex;gap:6px;flex-wrap:wrap}
.r .m .mrow{margin-top:6px}
.mt{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--bg);margin:0 !important}
.mt img,.mt video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.mt i{position:absolute;right:5px;bottom:3px;color:#fff;font-style:normal;font-size:12px}
.mx{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv b{color:var(--ac);text-align:right}
.lnk{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:15px}
</style>
</head>
<body>
<div class="app">
  <button class="gear" onclick="openSet()" aria-label="設定">⚙️</button>
  <div class="pets" id="pets"></div>
  <div id="pg_cal">
  <div class="card">
    <div class="mh"><button class="nb" onclick="mv(-1)">‹</button><b id="mt"></b><button class="nb" style="font-size:14px;color:var(--ac)" onclick="goToday()">今天</button><button class="nb" onclick="mv(1)">›</button></div>
    <div class="g" id="cal"></div>
  </div>
  <div class="card"><h3 id="dt"></h3><div id="list"></div></div></div>
  <div id="pg_rec" style="display:none"><div class="pets" id="tchips" style="margin-top:14px"></div><div class="card"><h3 id="rt"></h3><div id="rlist"></div></div><div id="rdel"></div></div>
  <div id="pg_pet" style="display:none"></div>
  <div id="pg_calc" style="display:none"></div>
  <div id="pg_vet" style="display:none"></div>
</div>
<nav class="nav" id="nav"></nav>
<button class="fab" onclick="openAdd()">＋ 新增紀錄</button>
<div class="ov" id="ov" onclick="if(event.target===this)closeSh()"><div class="sh" id="sh"></div></div>

<script>
var T=[['med','💊','用藥'],['deworm','🪱','驅蟲藥'],['vac','💉','疫苗'],['check','🩺','健檢'],['sneeze','🤧','打噴嚏'],['vomit','🤮','嘔吐'],['poop','💩','大小便'],['food','🍽️','食物'],['water','🚰','飲水'],['sick','🌡️','身體狀況'],['joy','✨','美好時刻']];
var K='petdiary_v1',S={pets:[],recs:[],cur:null},mem=null;
function load(){try{var v=localStorage.getItem(K);if(v)S=JSON.parse(v)}catch(e){if(mem)S=mem}}
function save(){mem=S;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var today=ymd(new Date()),sel=today,vm=new Date().getMonth(),vy=new Date().getFullYear(),pick='deworm';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function tinfo(k){return T.filter(function(t){return t[0]===k})[0]||['x','📝','其他']}

function renderCal(){
  var p=document.getElementById('pets');
  p.innerHTML=S.pets.map(function(x){return '<button class="chip'+(x.id===S.cur?' on':'')+'" onclick="setPet(\''+x.id+'\')">'+av(x)+esc(x.name)+'</button>'}).join('')+'<button class="chip" onclick="openPet()">＋ 新增寵物</button>';
  document.getElementById('mt').textContent=vy+' 年 '+(vm+1)+' 月';
  var has={};S.recs.forEach(function(r){if(r.pet===S.cur)has[r.date]=1});
  var h='日一二三四五六'.split('').map(function(w){return '<div class="w">'+w+'</div>'}).join('');
  var first=new Date(vy,vm,1).getDay(),n=new Date(vy,vm+1,0).getDate();
  for(var i=0;i<first;i++)h+='<div></div>';
  for(var d=1;d<=n;d++){var s=ymd(new Date(vy,vm,d));
    h+='<button class="d'+(s===today?' t':'')+(s===sel?' s':'')+(has[s]?' h':'')+'" onclick="pickDay(\''+s+'\')">'+d+'</button>'}
  document.getElementById('cal').innerHTML=h;
  var pet=S.pets.filter(function(x){return x.id===S.cur})[0];
  document.getElementById('dt').textContent=sel.replace(/-/g,'/')+(sel===today?'（今天）':'')+(pet?' · '+pet.name:'');
  var rs=S.recs.filter(function(r){return r.pet===S.cur&&r.date===sel}).sort(function(a,b){return a.ts-b.ts});
  document.getElementById('list').innerHTML=rs.length?rs.map(function(r){var t=tinfo(r.type);
    return '<div class="r"><div class="e">'+t[1]+'</div><div class="m"><b>'+esc(r.title||t[2])+'</b> <small style="color:var(--sub)">'+new Date(r.ts).toTimeString().slice(0,5)+'</small>'+det(r)+'</div><button class="x" onclick="delRec(\''+r.id+'\')">🗑️</button></div>'}).join(''):'<div class="empty">這天還沒有紀錄</div>';
}
function mv(n){vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}render()}
function pickDay(s){sel=s;render()}
function setPet(id){S.cur=id;save();render()}
function ask(m,fn){sheet('<h2>'+m+'</h2><div class="row"><button class="btn g2" onclick="closeSh()">取消</button><button class="btn" id="okb" style="margin-top:8px">確定</button></div>');document.getElementById('okb').onclick=function(){closeSh();fn()}}
window.alert=function(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%';document.body.appendChild(t);setTimeout(function(){t.remove()},2500)};
function delRec(id){ask('刪除這筆紀錄？',function(){delMedia(S.recs.filter(function(r){return r.id===id})[0]);S.recs=S.recs.filter(function(r){return r.id!==id});save();render()})}
function closeSh(){document.getElementById('sh').innerHTML='';document.getElementById('ov').classList.remove('on')}
function sheet(h){document.getElementById('sh').innerHTML=h;document.getElementById('ov').classList.add('on')}

function openAdd(){
  if(!S.pets.length){openPet();return}if(pg==='rec'&&rf!=='all')pick=GM[rf]?GM[rf][0]:rf;
  sheet('<h2>新增紀錄</h2><div class="ty">'+T.map(function(t){return '<button id="t_'+t[0]+'" class="'+(t[0]===pick?'on':'')+'" onclick="selT(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')+'<button onclick="openType(1)"><span>＋</span>自訂項目</button></div>'+formHTML()+'<button class="btn" onclick="addRec()">儲存</button>');selT(pick);
}
function selT(k){pick=k;refForm();T.forEach(function(t){document.getElementById('t_'+t[0]).classList.toggle('on',t[0]===k)})}
function addRec(){
  if(document.getElementById('fms').textContent){alert('照片／影片上傳中，請稍候');return}var d=document.getElementById('ad').value||sel;
  var g=function(i){return document.getElementById(i).value.trim()},c=OPT[pick]?'':g('fc'),r={id:uid(),pet:S.cur,date:d,type:pick,title:g('ft'),tags:[].map.call(document.querySelectorAll('#fopt .dt.on'),function(b){return b.textContent}),kg:g('fk'),dose:g('fd'),clinic:g('fh'),cycle:c,next:c?addCyc(d,c):'',media:pm.slice(),note:g('an'),ts:Date.now()};S.recs.push(r);
  save();sel=d;var dd=new Date(d+'T00:00:00');vy=dd.getFullYear();vm=dd.getMonth();closeSh();render();
}
function openPet(){
  sheet('<h2>新增寵物</h2><input id="pn" placeholder="寵物名字"><select id="pe"><option>🐱</option><option>🐶</option><option>🐰</option><option>🐹</option><option>🐦</option><option>🐢</option><option>🐾</option></select><button class="btn" onclick="addPet()">新增</button>');
}
function addPet(){
  var n=document.getElementById('pn').value.trim();if(!n)return;
  var p={id:uid(),name:n,emoji:document.getElementById('pe').value};
  S.pets.push(p);S.cur=p.id;save();closeSh();render();
}
function openSet(){
  sheet('<h2>設定</h2><h3>介面顏色</h3>'+colorUI()+'<h3 style="margin-top:16px">寵物</h3>'+(S.pets.map(function(x){return '<div class="pr"><span>'+x.emoji+' '+esc(x.name)+'</span><button class="x" onclick="delPet(\''+x.id+'\')">刪除</button></div>'}).join('')||'<div class="empty">尚無寵物</div>')+'<h3 style="margin-top:16px">備份與還原</h3><textarea id="bk" rows="4" placeholder="還原時請把備份文字貼在這裡"></textarea><button class="btn" onclick="doBk()">複製備份文字</button><button class="btn g2" onclick="doRs()">用上方文字還原</button>');
}
function delPet(id){
  ask('刪除這隻寵物與它所有的紀錄？',function(){delPet2(id)})}function delPet2(id){
  S.pets=S.pets.filter(function(p){return p.id!==id});S.recs=S.recs.filter(function(r){return r.pet!==id});
  if(S.cur===id)S.cur=S.pets.length?S.pets[0].id:null;save();closeSh();render();
}
function doBk(){
  var t=document.getElementById('bk');t.value=JSON.stringify(S);t.select();
  try{navigator.clipboard.writeText(t.value).then(function(){alert('已複製，請貼到備忘錄保存')},function(){alert('請長按文字全選並拷貝')})}catch(e){alert('請長按文字全選並拷貝')}
}
function doRs(){
  try{var o=JSON.parse(document.getElementById('bk').value);if(!o.pets||!o.recs)throw 0;
    ask('這會取代目前所有資料，確定嗎？',function(){S=o;save();closeSh();render()})}catch(e){alert('備份文字格式不正確')}
}
function goToday(){var n=new Date();sel=today;vy=n.getFullYear();vm=n.getMonth();render()}
var SW=['#9b51e0','#e8896b','#4a90d9','#3dae7c','#e5668c','#e0a030','#6b7280'];
function applyTheme(){var t=S.theme||{},r=document.documentElement;r.style.setProperty('--ac',t.ac||'#9b51e0');if(t.mode&&t.mode!=='auto')r.setAttribute('data-theme',t.mode);else r.removeAttribute('data-theme')}
function colorUI(){var t=S.theme||{},ac=t.ac||'#9b51e0',m=t.mode||'auto';
return '<div class="row" style="flex-wrap:wrap;margin-bottom:10px">'+SW.map(function(c){return '<button class="sw" onclick="setAc(\''+c+'\')" style="border:'+(c===ac?'3px solid var(--tx)':'1px solid var(--line)')+';background:'+c+'"></button>'}).join('')+'</div><div class="pr" style="border:0"><span>自訂顏色</span><input type="color" value="'+ac+'" oninput="setAc(this.value,1)" style="width:56px;height:36px;padding:2px;margin:0"></div><div class="row" style="margin-top:8px">'+[['auto','自動'],['light','淺色'],['dark','深色']].map(function(x){return '<button class="chip'+(x[0]===m?' on':'')+'" style="flex:1" onclick="setMode(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>'}
function setAc(c,quiet){S.theme=S.theme||{};S.theme.ac=c;save();applyTheme();if(!quiet)openSet()}
function setMode(m){S.theme=S.theme||{};S.theme.mode=m;save();applyTheme();openSet()}
var pg='cal',rf='all',fromAdd=0,BASE=T.slice();
var NAV=[['cal','📅','日曆'],['g_vet','💉','疫苗健檢'],['g_med','💊','用藥驅蟲'],['calc','🧮','計算'],['vet','🏥','獸醫院'],['pet','🐾','寵物']];
var F=[['name','名字','text'],['breed','品種','text'],['birth','生日','date'],['home','到家日','date'],['chip','晶片號碼','text'],['note','介紹／備註','textarea']];
function syncT(){T=BASE.concat(S.types||[]);(S.recs||[]).forEach(function(r){if(r.type==='drop')r.type='deworm'})}
function cur(){return S.pets.filter(function(x){return x.id===S.cur})[0]}
function av(x){return x.photo?'<img class="av" src="'+x.photo+'">':x.emoji+' '}
function go(k){if(k==='cal'||k==='pet'||k==='calc'||k==='vet')pg=k;else{pg='rec';rf=k}render();window.scrollTo(0,0)}
function setRf(k){rf=k;render()}
function render(){
  syncT();renderCal();
  ['cal','rec','pet','calc','vet'].forEach(function(k){document.getElementById('pg_'+k).style.display=k===pg?'':'none'});
  document.querySelector('.fab').style.display=(pg==='pet'||pg==='calc'||pg==='vet')?'none':'';
  if(pg==='rec')renderRec();if(pg==='pet')renderPet();if(pg==='calc')renderCalc();if(pg==='vet')renderVet();
  var on=pg==='rec'?rf:pg;
  document.getElementById('nav').innerHTML=NAV.map(function(n){return '<button class="'+(n[0]===on?'on':'')+'" onclick="go(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join('');
}
function renderRec(){
  document.getElementById('tchips').innerHTML='<button class="chip'+(rf==='all'?' on':'')+'" onclick="setRf(\'all\')">全部</button>'+GR.map(function(g){return '<button class="chip'+(rf===g[0]?' on':'')+'" onclick="setRf(\''+g[0]+'\')">'+g[1]+'</button>'}).join('')+T.map(function(t){return '<button class="chip'+(rf===t[0]?' on':'')+'" onclick="setRf(\''+t[0]+'\')">'+t[1]+' '+t[2]+'</button>'}).join('')+'<button class="chip" onclick="openType()">＋ 新增項目</button>';
  var rs=S.recs.filter(function(r){return r.pet===S.cur&&(rf==='all'||r.type===rf||(GM[rf]&&GM[rf].indexOf(r.type)>-1))}).sort(function(a,b){return b.date.localeCompare(a.date)||b.ts-a.ts});
  var gn=(GR.filter(function(g){return g[0]===rf})[0]||[])[1],t=gn?['','',gn]:tinfo(rf);
  document.getElementById('rt').textContent=rf==='all'?'所有紀錄（'+rs.length+' 筆）':t[1]+' '+t[2]+'紀錄（'+rs.length+' 筆）';
  document.getElementById('rlist').innerHTML=rs.length?rs.map(function(r){var x=tinfo(r.type);return '<div class="r"><div class="e">'+x[1]+'</div><div class="m"><b>'+r.date.replace(/-/g,'/')+'</b> '+esc(r.title||'')+((rf==='all'||GM[rf])?' <small style="color:var(--sub)">'+x[2]+'</small>':'')+det(r)+'</div><button class="x" onclick="delRec(\''+r.id+'\')">🗑️</button></div>'}).join(''):'<div class="empty">還沒有紀錄，點下方「＋ 新增紀錄」</div>';
  var cu=(S.types||[]).filter(function(x){return x[0]===rf})[0];
  document.getElementById('rdel').innerHTML=cu?'<button class="btn g2" onclick="delType(\''+rf+'\')">刪除「'+cu[2]+'」項目</button>':'';
}
function openType(a){fromAdd=a||0;sheet('<h2>新增項目</h2><input id="tn" placeholder="項目名稱（例如：眼藥水、心絲蟲藥）"><input id="te" placeholder="圖示（一個表情符號）" value="💊" maxlength="4"><button class="btn" onclick="addType()">新增</button>')}
function addType(){var n=document.getElementById('tn').value.replace(/[<>&"']/g,'').trim(),e=(document.getElementById('te').value||'📝').replace(/[<>&"']/g,'');if(!n)return;var k='c_'+uid();S.types=S.types||[];S.types.push([k,e,n]);save();syncT();pick=k;if(pg==='rec')rf=k;closeSh();if(fromAdd)openAdd();else render();fromAdd=0}
function delType(k){ask('刪除這個項目？已記錄的內容會保留並歸為「其他」。',function(){delType2(k)})}function delType2(k){S.types=(S.types||[]).filter(function(x){return x[0]!==k});rf='all';save();render()}
function dd(s){return Math.floor((new Date(today+'T00:00:00')-new Date(s+'T00:00:00'))/864e5)}
