<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>寵物日記</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#2b2724;--sub:#8a827a;--line:#ece7e1;--ac:#e8896b;--acbg:#fcebe5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--card:#262321;--tx:#f1ece6;--sub:#9a928a;--line:#37332f;--ac:#f0997c;--acbg:#3a2a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a18;--card:#262321;--tx:#f1ece6;--sub:#9a928a;--line:#37332f;--ac:#f0997c;--acbg:#3a2a25;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.app{max-width:480px;margin:0 auto;padding:16px 16px 150px}
.pets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:14px;border:1px solid var(--line)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mh b{font-size:17px}
.nb{border:0;background:none;color:var(--tx);font-size:22px;padding:4px 12px}
.g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:4px}
.w{font-size:12px;color:var(--sub);padding:4px 0}
.d{position:relative;height:42px;border:0;background:none;color:var(--tx);font-size:15px;border-radius:12px}
.d.t{color:var(--ac);font-weight:700}
.d.s{background:var(--ac);color:#fff}
.d.h::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.d.s.h::after{background:#fff}
h3{margin:0 0 8px;font-size:15px;color:var(--sub);font-weight:600}
.r{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.r:first-of-type{border-top:0}
.r .e{font-size:22px}
.r .m{flex:1;min-width:0}
.r .m b{font-size:15px}
.r .m div{font-size:14px;color:var(--sub);white-space:pre-wrap;word-break:break-word;margin-top:2px}
.x{border:0;background:none;color:var(--sub);font-size:20px;padding:6px 8px}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ac);color:#fff;border:0;border-radius:28px;padding:15px 28px;font-size:17px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.gear{float:right;border:0;background:none;font-size:20px;color:var(--sub)}
#pets{clear:both;padding-top:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:88%;overflow-y:auto}
.sh h2{margin:0 0 12px;font-size:18px}
.ty{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ty button{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:14px;padding:10px 2px;font-size:12px}
.ty button span{display:block;font-size:24px}
.ty button.on{border-color:var(--ac);background:var(--acbg)}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px;font-size:16px;font-family:inherit;margin-bottom:10px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;background:var(--ac);color:#fff}
.btn.g2{background:var(--acbg);color:var(--ac);margin-top:8px}
.row{display:flex;gap:8px}
.pr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--acbg:color-mix(in srgb,var(--ac) 14%,var(--card)) !important}
.sw{width:36px;height:36px;border-radius:50%;padding:0}
.nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav button{flex:1;border:0;background:none;color:var(--sub);padding:8px 0 6px;font-size:11px;font-family:inherit}
.nav button span{display:block;font-size:21px}
.nav button.on{color:var(--ac);font-weight:700}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:4px}
.big{width:110px;height:110px;border-radius:50%;background:var(--acbg);display:flex;align-items:center;justify-content:center;font-size:54px;margin:0 auto 8px;overflow:hidden}
.big img{width:100%;height:100%;object-fit:cover}
.lb{display:block;font-size:13px;color:var(--sub);margin:2px 0 4px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 8px}
.fr>div{min-width:0}
.sh{overflow-x:hidden}
.sh input,.sh select,.sh textarea,.card input,.card select,.card textarea{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;display:block}
.sh .lb{margin-top:8px}
.mrow{display:flex;gap:6px;flex-wrap:wrap}
.r .m .mrow{margin-top:6px}
.mt{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--bg);margin:0 !important}
.mt img,.mt video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.mt i{position:absolute;right:5px;bottom:3px;color:#fff;font-style:normal;font-size:12px}
.mx{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv b{color:var(--ac);text-align:right}
.lnk{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:15px}
.fh{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;color:var(--tx);font-size:16px;font-weight:700;padding:2px 0;font-family:inherit;text-align:left}
.tb{display:flex;gap:8px;margin-top:10px}.tb button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:9px;font-size:14px;font-family:inherit}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Noto+Serif+TC:wght@400;600;700&amp;family=Oswald:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
/* ===== 介面風格（skin）共用 ===== */
html[data-skin] body{font-family:'Noto Sans TC',-apple-system,"PingFang TC",sans-serif;transition:background-color .25s}
html[data-skin] .chip.on,html[data-skin] .btn,html[data-skin] .fab,html[data-skin] .d.s{color:var(--onac)}
html[data-skin] .btn.g2{color:var(--ac)}
html[data-skin] .d.s.h::after{background:var(--onac)}
html[data-skin=b] .card{border:0;border-radius:20px}
.ml{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mk{fill:var(--ink)}.mke{fill:color-mix(in srgb,var(--ink) 80%,var(--bg))}.mpp{fill:var(--card)}.ma{fill:var(--ac)}
.msc{fill:none;stroke:var(--ac);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* 設定：風格卡片 */
.skg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.skc{display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--tx);border-radius:14px;padding:8px;font-family:inherit}
.skc.on{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 30%,transparent)}
.skc b{font-size:14px}.skc small{font-size:11px;color:var(--sub)}
.skp{position:relative;display:block;height:34px;border-radius:9px;border:1px solid var(--line);overflow:hidden}
.skp i{position:absolute;right:8px;top:8px;width:16px;height:16px;border-radius:50%}
.skp em{position:absolute;left:8px;top:9px;width:42%;height:5px;border-radius:3px;opacity:.55}
.swr{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
/* 首頁主角 */
.hero{position:relative;margin:4px 0 2px;clear:both}
.hpets{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;position:relative;z-index:2}
.hpets .chip{padding:6px 12px;font-size:14px}
/* B 簡約風格 */
.hb .hb-card{position:relative;overflow:hidden;background:var(--ac);color:var(--onac);border-radius:24px;padding:18px;min-height:150px}
.hb-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hb-av{width:60px;height:60px;border-radius:50%;flex:none;background:color-mix(in srgb,var(--onac) 18%,var(--ac));border:2px solid color-mix(in srgb,var(--onac) 45%,var(--ac));display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.hb-av img{width:100%;height:100%;object-fit:cover}
.hb-n{font-size:24px;font-weight:900;letter-spacing:1px}.hb-s{font-size:13px;opacity:.85}
.hb-d{position:relative;z-index:1;display:inline-block;margin-top:14px;background:color-mix(in srgb,var(--onac) 14%,var(--ac));border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700}
.hb-art{position:absolute;right:-4px;bottom:-8px;width:150px;height:140px;color:var(--onac);opacity:.5}
/* E 古典油畫 */
.he-row{display:flex;gap:18px;align-items:flex-end;padding:4px 2px}
.he-fr{flex:none;padding:5px;border:1px solid color-mix(in srgb,var(--ac) 45%,var(--line));border-radius:64px 64px 3px 3px}
.he-in{width:112px;height:140px;border-radius:58px 58px 2px 2px;overflow:hidden}.he-in svg{display:block;width:100%;height:100%}
.he-t{flex:1;min-width:0;padding-bottom:4px}
.he-t i{font:italic 500 15px 'Cormorant Garamond',serif;color:color-mix(in srgb,var(--ac) 55%,var(--tx))}
.he-t b{display:block;font:700 32px/1.2 'Noto Serif TC',serif;letter-spacing:4px;word-break:break-all}
.he-t small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.he-bar{display:block;width:28px;height:2px;background:var(--ac);margin:12px 0 8px}
/* F 海報雜誌 */
.hf .hart{position:relative;margin:4px -16px 0;background:var(--ac);color:var(--onac);height:320px;overflow:hidden}
.hf-moon{position:absolute;left:50%;top:-92px;width:230px;height:230px;margin-left:-115px;border-radius:50%;overflow:hidden}.hf-moon svg{display:block;width:100%;height:100%}
.hf-top{position:absolute;left:18px;right:18px;top:14px;display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:1.5px}
.hf-date{position:absolute;left:18px;top:156px;font:400 32px/.95 'Bebas Neue',sans-serif}
.hf-sub{position:absolute;right:18px;top:166px;text-align:right;font-size:11px;letter-spacing:2px;opacity:.75}
.hf-days{position:absolute;left:0;right:0;top:226px;text-align:center;font-size:11px;letter-spacing:3px}
.hf-name{position:absolute;left:0;right:0;top:240px;text-align:center;font-weight:900;letter-spacing:6px;line-height:1.1;white-space:nowrap;overflow:hidden}
/* J 藍色拼貼 */
.hj .hart{position:relative;margin:4px -16px 0;height:290px}
.hj-pp{position:absolute;inset:0;background:var(--card);clip-path:polygon(0 0,100% 0,100% 88%,92% 92%,84% 87%,74% 94%,63% 89%,52% 96%,41% 90%,30% 95%,20% 88%,9% 93%,0 89%)}
.hj-tape{position:absolute;left:-20px;top:192px;width:290px;height:66px;background:var(--ac);transform:rotate(-4deg);clip-path:polygon(2% 10%,30% 0,60% 8%,100% 2%,97% 90%,70% 100%,35% 92%,0 100%)}
.hj-tt{position:absolute;left:22px;top:212px;font:700 20px 'Oswald',sans-serif;color:var(--onac);transform:rotate(-4deg);letter-spacing:1px}
.hj-dt{position:absolute;left:20px;top:22px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--sub)}
.hj-t{position:absolute;left:18px;top:44px;font-size:50px;font-weight:900;line-height:1.08;letter-spacing:-1px;color:var(--tx)}
.hj-t span{color:var(--ac)}
.hj-s{position:absolute;left:20px;top:166px;font-size:13px;font-weight:500;color:var(--tx)}
.hj-art{position:absolute;right:6px;top:26px;width:150px;height:150px}
.hj-star{position:absolute;left:58%;top:196px;width:52px;height:52px}
/* N 柔霧剪影 */
.hn .hart{position:relative;margin:0 -16px;height:330px;overflow:hidden}
.hn-art{position:absolute;left:-26px;bottom:-4px;width:250px;height:333px}
.hn-art.dg{left:-36px;bottom:-30px;width:280px;height:280px}
.hn-t{position:absolute;right:20px;top:34px;text-align:right;max-width:60%}
.hn-t small{display:block;font-size:13px;color:var(--sub)}
.hn-t b{display:block;font-size:30px;font-weight:700;line-height:1.3;margin-top:4px;word-break:break-all}
.hn-t em{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-top:8px}

/* ===== E 古典油畫 ===== */
html[data-skin=e] body{font-family:'Noto Serif TC',serif}
html[data-skin=e] .card{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 2px}
html[data-skin=e] h3{font:italic 500 17px 'Cormorant Garamond','Noto Serif TC',serif;color:color-mix(in srgb,var(--ac) 55%,var(--tx));letter-spacing:1px}
html[data-skin=e] .mh b{font-weight:600;letter-spacing:2px}
html[data-skin=e] .d{font:500 18px 'Cormorant Garamond',serif;border-radius:50%;width:38px;height:38px;margin:2px auto}
html[data-skin=e] .chip{border-radius:0;background:transparent;border:1px solid var(--line)}
html[data-skin=e] .chip.on{background:var(--ac);border-color:var(--ac)}
html[data-skin=e] .btn{border-radius:0;letter-spacing:3px;font-family:'Noto Serif TC',serif}
html[data-skin=e] .btn.g2{background:transparent;border:1px solid var(--line);color:var(--tx)}
html[data-skin=e] .fab{border-radius:0;background:var(--bg);color:var(--tx);border:1px solid var(--ac);box-shadow:none;letter-spacing:4px;font-family:'Noto Serif TC',serif}
html[data-skin=e] .sh,html[data-skin=e] .ty button,html[data-skin=e] input,html[data-skin=e] select,html[data-skin=e] textarea{border-radius:0}
html[data-skin=e] .nav{background:var(--bg)}
html[data-skin=e] .nav button span,html[data-skin=f] .nav button span,html[data-skin=j] .nav button span,html[data-skin=n] .nav button span{display:none}
.nav button span svg{display:block;width:22px;height:22px;margin:0 auto 2px}
.ni{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html[data-skin=b] .nav button{padding:9px 0 7px;font-weight:500}
html[data-skin=b] .nav button.on{color:var(--ac);font-weight:700}
html[data-skin=n] .nav button{font-size:13px;padding:15px 0 13px;letter-spacing:1px}
html[data-skin=n] .nav button.on{font-weight:700}
html[data-skin=e] .nav button{font-family:'Noto Serif TC',serif;font-size:13px;padding:15px 0 13px;position:relative}
html[data-skin=e] .nav button.on{color:var(--tx)}
html[data-skin=e] .nav button.on::before{content:"";position:absolute;top:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
/* ===== F 海報雜誌 ===== */
html[data-skin=f] .card{background:transparent;border:0;border-top:2px solid var(--tx);border-radius:0;padding:10px 2px 12px}
html[data-skin=f] h3{font:400 24px 'Bebas Neue','Noto Sans TC',sans-serif;color:var(--tx);letter-spacing:1px}
html[data-skin=f] .mh b{font:400 26px 'Bebas Neue','Noto Sans TC',sans-serif;letter-spacing:1px}
html[data-skin=f] .d{font:400 21px 'Bebas Neue','Noto Sans TC',sans-serif;border-radius:0}
html[data-skin=f] .d.h::after{width:14px;height:2px;border-radius:0;margin-left:-7px}
html[data-skin=f] .chip{border-radius:0;background:transparent;border:1.5px solid var(--tx);font-weight:700}
html[data-skin=f] .chip.on{background:var(--ac);border-color:var(--ac)}
html[data-skin=f] .btn{border-radius:0;font-weight:900;letter-spacing:3px}
html[data-skin=f] .btn.g2{background:transparent;border:1.5px solid var(--tx);color:var(--tx)}
html[data-skin=f] .fab{border-radius:0;font-weight:900;letter-spacing:3px}
html[data-skin=f] .r .m b{font-weight:900}
html[data-skin=f] .sh,html[data-skin=f] .ty button,html[data-skin=f] input,html[data-skin=f] select,html[data-skin=f] textarea{border-radius:0}
html[data-skin=f] .nav{background:var(--ac);border-top:0}
html[data-skin=f] .nav button{color:color-mix(in srgb,var(--onac) 62%,var(--ac));font-size:12px;letter-spacing:1px;padding:15px 0 13px}
html[data-skin=f] .nav button.on{color:var(--onac);font-weight:900}
/* ===== J 藍色拼貼 ===== */
html[data-skin=j] .card{background:var(--card);border:2px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--ink)}
html[data-skin=j] h3{font:700 15px 'Oswald','Noto Sans TC',sans-serif;letter-spacing:1px;color:var(--tx)}
html[data-skin=j] .mh b{font:700 20px 'Oswald','Noto Sans TC',sans-serif}
html[data-skin=j] .d{border-radius:0;font:700 15px 'Oswald',sans-serif}
html[data-skin=j] .d.h{background:var(--ink);color:var(--bg)}
html[data-skin=j] .d.h::after{display:none}
html[data-skin=j] .d.s{background:var(--ac);box-shadow:inset 0 0 0 2px var(--ink)}
html[data-skin=j] .chip{border-radius:0;border:2px solid var(--ink);background:var(--card);font-weight:900}
html[data-skin=j] .chip.on{background:var(--ac);border-color:var(--ink)}
html[data-skin=j] .btn{border-radius:0;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:900;letter-spacing:2px}
html[data-skin=j] .btn.g2{background:var(--card);color:var(--tx)}
html[data-skin=j] .fab{border-radius:0;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
html[data-skin=j] .sh{border-radius:0;border-top:3px solid var(--ink)}
html[data-skin=j] .ty button,html[data-skin=j] input,html[data-skin=j] select,html[data-skin=j] textarea{border-radius:0;border:2px solid var(--ink)}
html[data-skin=j] .nav{background:var(--ink);border-top:0}
html[data-skin=j] .nav button{color:color-mix(in srgb,var(--bg) 62%,var(--ink));font-size:13px;padding:15px 0 13px}
html[data-skin=j] .nav button.on{color:var(--bg);font-weight:900;box-shadow:inset 0 -3px 0 var(--ac)}
/* ===== N 柔霧剪影 ===== */
html[data-skin=n] body{background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 50%,var(--bg2)) 50%,var(--bg2) 100%) fixed;min-height:100vh}
html[data-skin=n] .card{background:color-mix(in srgb,var(--card) 60%,transparent);border:1px solid color-mix(in srgb,var(--card) 85%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:24px}
html[data-skin=n] .d{border-radius:50%;width:38px;height:38px;margin:2px auto}
html[data-skin=n] .d.s{background:var(--ink);color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 30%,transparent)}
html[data-skin=n] .d.h::after,html[data-skin=n] .d.s.h::after{background:var(--ac);box-shadow:0 0 6px var(--ac)}
html[data-skin=n] .chip{background:color-mix(in srgb,var(--card) 50%,transparent);border-color:color-mix(in srgb,var(--card) 85%,transparent)}
html[data-skin=n] .chip.on{background:var(--ink);border-color:var(--ink);color:var(--ac)}

<script>
var T=[['med','💊','用藥'],['deworm','🪱','驅蟲藥'],['vac','💉','疫苗'],['check','🩺','健檢'],['sneeze','🤧','打噴嚏'],['vomit','🤮','嘔吐'],['poop','💩','大小便'],['food','🍽️','食物'],['water','🚰','飲水'],['sick','🌡️','身體狀況'],['joy','✨','美好時刻']];
var K='petdiary_v1',S={pets:[],recs:[],cur:null},mem=null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

  if(!S.pets.length){openPet();return}if(pg==='rec'&&rf!=='all')pick=GM[rf]?GM[rf][0]:rf;if(!T.some(function(t){return t[0]===pick}))pick=T[0][0];

function editRec(id){var r=S.recs.filter(function(x){return x.id===id})[0];if(!r)return;EDIT=id;pick=r.type;PEND=(r.media||[]).slice();

function addRec(){
  if(document.getElementById('fms').textContent){alert('照片／影片上傳中，請稍候');return}var d=document.getElementById('ad').value||sel;
  var g=function(i){return document.getElementById(i).value.trim()},c=OPT[pick]?'':g('fc'),r={id:uid(),pet:(document.getElementById('fpet')||{}).value||S.cur,date:d,type:pick,title:g('ft'),tags:[].map.call(document.querySelectorAll('#fopt .dt.on'),function(b){return b.textContent}),kg:g('fk'),dose:g('fd'),clinic:g('fh'),cycle:c,next:c?addCyc(d,c):'',media:pm.slice(),note:g('an'),ts:Date.now()};
  if(EDIT){var old=S.recs.filter(function(x){return x.id===EDIT})[0];if(old){r.id=old.id;r.ts=old.ts;
      var gone=(old.media||[]).filter(function(m){return !r.media.some(function(n){return n.id===m.id})});

[1,'🍷','酒精（含料理酒、酒釀、含酒甜點）','很小的量就可能中毒，造成嘔吐、昏睡、呼吸變慢。'],

[1,'🌷','百合科植物（百合、萱草）','不是食物但非常危險：花瓣、花粉、花瓶水都可能造成急性腎衰竭。'],
[2,'🍬','木糖醇（無糖口香糖、無糖糖果）','對狗確定劇毒，貓的資料較少，建議一律避免。'],

[2,'🐟','生魚、生肉、生蛋白','可能有沙門氏菌或寄生蟲；生魚的硫胺酶會破壞維生素 B1，生蛋白會影響皮膚與毛髮。'],
[2,'🥛','牛奶、乳製品','多數成貓乳糖不耐，容易拉肚子；可改喝貓專用牛奶。'],

[2,'🐠','人用鮪魚罐頭、長期只吃魚','鈉含量高，營養不均衡，長期可能造成黃脂肪症或汞累積。'],
[2,'🍗','大量肝臟','維生素 A 過量會造成骨骼異常與疼痛。'],
[2,'🍅','未熟番茄、馬鈴薯（綠色部分、莖葉）','含茄鹼，會造成腸胃不適與神經症狀。'],
[2,'🍎','蘋果籽、櫻桃、桃、李子的核','種子含微量氰化物，核也可能造成梗塞。'],
[2,'🐕','狗飼料當主食','缺少貓必需的牛磺酸，長期會傷心臟與眼睛。'],
[2,'🍰','甜點、含糖零食、油炸高脂食物','容易造成肥胖、糖尿病與胰臟炎。']

common:[
['🩺','定期健檢與疫苗','幼年依獸醫排程完成疫苗；成年每年健檢一次，7 歲以上的高齡寵物建議每半年一次，早期發現問題比較好處理。'],

['🏷️','晶片與登記','建議植入晶片並完成寵物登記，走失時比較容易找回；詳細規定請洽當地動物保護或動物防疫機關。'],
['✂️','絕育','依獸醫建議的時間點評估絕育，可以降低部分疾病風險，也減少亂跑與標記行為。'],
['🍽️','定時定量、選對飼料','選擇符合年齡階段（幼年、成年、高齡）的主食，照包裝建議量並依體態調整；換糧要用 7 到 10 天慢慢混合，避免腸胃不適。'],
['💧','隨時有乾淨的水','水碗每天換水、定期清洗，多放幾個位置；生病時飲水量也是重要線索。'],
['⚖️','控制體重','肥胖會增加糖尿病、關節和心臟問題；每月固定量體重，摸得到肋骨、但看不出肋骨的輪廓是比較理想的體態。'],
['🦷','牙齒、毛髮與指甲','定期刷牙或做牙齒清潔、梳毛、剪指甲、檢查耳朵；口臭或牙結石明顯時請獸醫評估。'],

['🌡️','天氣與溫度','夏天不要把寵物留在車上或悶熱的地方，正午避免外出，柏油路面可能燙傷腳掌；冬天提供保暖的窩。'],
['🤝','陪伴與互動','每天安排固定的互動和玩耍時間；長時間獨處容易焦慮、破壞物品或亂尿。'],
['🧳','緊急準備','把常去的獸醫院和 24 小時急診的電話、地址存好（可以用本 App 的獸醫院頁面）；準備外出籠或牽繩。'],
['💰','長期責任','貓狗壽命常有 10 年以上，要考慮醫療、飼料、保險與生活安排，生病時的醫藥費也要預先準備。']],
cat:[
['🚽','貓砂盆','數量最好是貓的數量再加 1，放在安靜、好進出的地方，每天清理；突然不用貓砂盆可能是疾病或壓力。'],
['🥣','多喝水','貓天生不愛喝水；多放幾個水碗或使用飲水機、搭配濕食，有助預防泌尿道問題。'],
['🪵','貓的天性','提供貓抓板、可以爬高的位置和躲藏的空間，才能滿足抓、爬、躲的需求。'],
['🏢','防墜與室內飼養','貓可能從陽台或窗戶墜落（高樓症候群），防護網要確實；室內飼養能降低傳染病和意外風險。'],
['🌿','小心毒物','百合科植物、人用止痛藥和某些精油（例如茶樹油）對貓很危險，不要讓貓接觸。'],
['😾','減少壓力','搬家、新成員、陌生人都可能造成壓力；環境變化時提供躲藏處，讓牠慢慢適應。']],
dog:[
['🚶','每天散步與運動','依年齡與體型安排每日散步和遊戲；運動不足容易肥胖和出現破壞行為。'],
['🦮','牽繩與糞便處理','外出一定要牽繩並確認項圈或胸背帶合適，記得撿便；不要讓狗亂吃路邊的東西。'],
['🎓','社會化與基礎訓練','幼犬時期多接觸不同的人、狗和環境，學會坐下、等待、召回，對安全與相處都有幫助。'],
['🥵','預防中暑','狗靠喘氣散熱，天氣熱時避免激烈運動；短鼻犬（如鬥牛犬、巴哥）和肥胖的狗特別容易中暑。'],
['🦴','選對玩具與零食','玩具大小要合適，避免能一口吞下的尺寸；不要給煮熟的骨頭或會剝落成碎片的東西。'],
['🏡','避免長時間獨處','狗需要陪伴，長時間獨處容易分離焦慮；外出前先讓牠運動，並準備安全的玩具。']]};
